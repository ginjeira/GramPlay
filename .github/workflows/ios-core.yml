name: iOS core frameworks

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ios-core.yml"
  pull_request:
    paths:
      - "core/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ios-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2"
      SPOTYGRAM_STATE: ${{ runner.temp }}/gramplay-state
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build iPhone and Apple silicon simulator frameworks
        run: ./gradlew :core:linkDebugFrameworkIosArm64 :core:linkDebugFrameworkIosSimulatorArm64 --no-daemon
