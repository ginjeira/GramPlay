name: iOS core frameworks

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "ios/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ios-core.yml"
  pull_request:
    paths:
      - "core/**"
      - "ios/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ios-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Set private build state
        run: echo "SPOTYGRAM_STATE=$RUNNER_TEMP/gramplay-state" >> "$GITHUB_ENV"
      - name: Assemble iOS XCFramework
        run: ./gradlew :core:assembleCoreDebugXCFramework --no-daemon
      - name: Prepare Xcode framework
        run: |
          mkdir -p ios/GramPlay/Frameworks
          ditto "$SPOTYGRAM_STATE/build/core/XCFrameworks/debug/core.xcframework" ios/GramPlay/Frameworks/core.xcframework
      - name: Build iOS app for simulator
        run: xcodebuild -project ios/GramPlay.xcodeproj -scheme GramPlay -sdk iphonesimulator -configuration Debug -derivedDataPath "$SPOTYGRAM_STATE/ios-derived" CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v7
        with:
          name: gramplay-ios-simulator-app
          path: ${{ env.SPOTYGRAM_STATE }}/ios-derived/Build/Products/Debug-iphonesimulator/GramPlay.app
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: gramplay-core-xcframework
          path: ${{ env.SPOTYGRAM_STATE }}/build/core/XCFrameworks/debug/core.xcframework
          if-no-files-found: error
          retention-days: 7
